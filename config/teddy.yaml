# Teddy AI Configuration
# Customize these settings for your setup

# LLM Configuration
llm:
  primary_provider: "ollama"
  
  providers:
    ollama:
      enabled: true
      api_url: "http://localhost:11434"  # Change to your Windows IP if connecting from container
      model: "qwen:7b"
      timeout: 300

    gemini:
      enabled: false
      model: "gemini-2.5-flash"
      api_key_env: "GEMINI_API_KEY"
      timeout: 60
    
    local_ollama:
      enabled: false
      api_url: "http://localhost:11434"
      model: "llama2:13b"
      timeout: 300
    
    cloud:
      enabled: false
      provider: "openai"  # or "anthropic"
      api_key: ""  # Set via environment variable
      model: "gpt-4"
  
  # Routing configuration
  routing:
    default: "ollama"
    allow_cloud_fallback: false
    cloud_fallback_on_error: false

# Voice Configuration
voice:
  audio:
    sample_rate: 16000
    channels: 1
    device: null  # Set an input device index or name to override the system default
    wake_word: "Emma"
    listen_chunk_seconds: 3.0
    show_heard_text: false
    intent_words:
      greeting: ["hi", "hello", "hey", "emma"]
      goodbye: ["bye", "goodbye", "tata"]
      story: ["story", "katha", "tale"]
      poem: ["poem", "poetry", "rhyme", "rhymes", "rhyming"]
      song: ["song", "sing", "music", "lullaby"]
      animal: ["animal", "dog", "cat", "lion", "tiger", "elephant", "bird", "fish"]
      nature: ["tree", "flower", "rain", "sun", "moon", "star"]
      space: ["space", "rocket", "planet", "star", "moon"]
      numbers: ["number", "numbers", "count", "counting", "math"]
      repeat: ["again", "more", "once more"]
      stop: ["stop", "no", "enough", "finished", "done"]
      yes: ["yes", "yeah", "yep", "sure", "please", "okay", "ok"]
      emotions: ["happy", "sad", "angry", "scared", "sleepy", "tired"]
      food: ["milk", "water", "food", "banana", "apple"]
      body: ["hand", "head", "eyes", "nose", "ear", "mouth"]

  stt:
    engine: "whisper"
    config:
      model: "base"  # tiny, base, small, medium, large
      language: "en"
      device: "cpu"  # or "cuda" for GPU
  
  tts:
    engine: "piper"
    config:
      voice: "en_US-jenny_low"
      model_path: "./models/en_US-lessac-medium.onnx"
      speaker: 0
      length_scale: 1.25
      noise_scale: 0.667

# Memory Configuration
memory:
  backend: "sqlite"
  
  sqlite:
    db_path: "./data/teddy.db"
  
  postgresql:
    host: "localhost"
    port: 5432
    database: "teddy"
    user: "teddy"
    password: ""

# Local knowledge library
knowledge:
  enabled: true
  root_path: "./knowledge"
  chunk_size: 900
  worker:
    enabled: true
    analyze_with_ollama: true
    model: "qwen:7b"
    max_files_per_cycle: 1
    poll_seconds: 2

# Personality Configuration
personality:
  config_path: "./personality/teddy_default.yaml"

# Child Profile
child:
  name: "Neo"
  age: 0
  age_group: "preschool"  # toddler, preschool, early_school, school_age, teen
  language: "auto"
  interests: []
  favorite_animals: []
  favorite_colors: []

# Logging
logging:
  level: "INFO"
  format: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"
  file: "./logs/teddy.log"

# API Server
api:
  host: "127.0.0.1"
  port: 8000
  debug: false
  cors_origins: ["http://localhost:3000"]

# Development
development:
  mock_stt: false  # Use mock STT for testing
  mock_tts: false  # Use mock TTS for testing
  mock_llm: false  # Use mock LLM responses
  log_prompts: true  # Log prompts sent to LLM
